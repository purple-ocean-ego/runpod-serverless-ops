name: Build and Push RTX5090 Image to DockerHub

on:
  push:
    # RTX 5090 用イメージは rtx5090-v* タグでビルドする (例: rtx5090-v1.0.0)
    tags: [ "rtx5090-*" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: DOCKERHUB
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          # RTX 5090 専用イメージ (serverless 用とは分離)
          images: ${{ secrets.DOCKERHUB_USERNAME }}/runpod-h3-rtx5090
          tags: |
            # rtx5090-v1.0.0 → v1.0.0 を生成
            type=match,pattern=^rtx5090-(.*)$,group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/rtx5090-v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max